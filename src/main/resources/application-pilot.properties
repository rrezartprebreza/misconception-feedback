# Pilot profile: run the evaluation once and exit, no web server.
spring.main.web-application-type=none

# Free provider tiers limit tokens per minute (Groq: about 7000-8000 per model). A pilot sends one request per
# answer, so it pauses between answers and waits and retries when the provider answers 429 (rate limit).
study.pilot.pause-ms=${PILOT_PAUSE_MS:9000}
spring.ai.retry.on-http-codes=429
spring.ai.retry.max-attempts=8
spring.ai.retry.backoff.initial-interval=5s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=60s
