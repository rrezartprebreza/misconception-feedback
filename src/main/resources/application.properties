spring.application.name=misconception-feedback

# Fix the provider, model and settings for the whole study and report them in the paper.

# Local Ollama (default Maven profile). Run `ollama pull <model>` first.
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5-coder:7b}
spring.ai.ollama.chat.options.temperature=0.0

# Hosted OpenAI (build with -Popenai).
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# Optional automatic fallback when a model is rate limited, e.g. LLM_FALLBACK_MODELS=openai/gpt-oss-120b
# (comma separated, tried in order). Leave empty for a study: the model must stay fixed.
llm.fallback-models=${LLM_FALLBACK_MODELS:}
llm.fallback-cooldown-seconds=${LLM_FALLBACK_COOLDOWN_SECONDS:60}
spring.ai.retry.max-attempts=2
# Any OpenAI-compatible service works (Grok, Gemini, Groq, OpenRouter): set the base URL, key and model.
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.completions-path=${OPENAI_COMPLETIONS_PATH:/v1/chat/completions}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.0

# Language of this instance: java, python or csharp. Picks the catalogue, exercises and pilot set.
study.language=${STUDY_LANGUAGE:java}

# Matches below this confidence are dropped by the detector.
study.detector.threshold=0.6

# Study mode (/study.html). Logs hold student work: keep the file outside git (study-data/ is ignored).
study.log-file=study-data/submissions.jsonl
# Label written into every log line. Set STUDY_MODEL_LABEL when using a hosted model.
study.model-label=${STUDY_MODEL_LABEL:${OLLAMA_MODEL:qwen2.5-coder:7b}}
# Optional: study.tasks-file=study-data/tasks.json to use your own exercises.
