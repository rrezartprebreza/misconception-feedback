spring.application.name=misconception-feedback

# Fix model and settings for the whole study and report them in the paper.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${LLM_MODEL:gpt-4o-mini}
