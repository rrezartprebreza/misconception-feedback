<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misconception feedback</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    p.lead { color: #555; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 1rem 0 .25rem; }
    textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem; border: 1px solid #bbb; border-radius: 6px; }
    textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; border: 0; border-radius: 6px; background: #2457c5; color: #fff; cursor: pointer; }
    button:disabled { background: #8a9bc4; cursor: wait; }
    .card { border: 1px solid #d5d5d5; border-radius: 8px; padding: .75rem 1rem; margin-top: 1rem; }
    .card h2 { font-size: 1rem; margin: 0 0 .4rem; }
    .tag { display: inline-block; background: #eef2fb; border-radius: 4px; padding: .1rem .5rem; margin-right: .4rem; font-size: .85rem; }
    .error { color: #a40000; }
    .note { font-size: .85rem; color: #666; margin-top: 1.5rem; }
    pre.feedback { white-space: pre-wrap; font-family: inherit; margin: 0; }
  </style>
</head>
<body>
  <h1>Misconception feedback</h1>
  <p class="lead">Paste your Java answer and get feedback that targets the idea behind your mistake.</p>

  <label for="task">Task</label>
  <textarea id="task" rows="2" placeholder="For example: Implement binary search on a sorted int array."></textarea>

  <label for="code">Your Java code</label>
  <textarea id="code" class="code" rows="10" spellcheck="false"></textarea>

  <label for="explanation">Your explanation (optional)</label>
  <textarea id="explanation" rows="3" placeholder="In your own words, how does it work?"></textarea>

  <label for="condition">Feedback type</label>
  <select id="condition">
    <option value="INFORMED">Misconception-aware (recommended)</option>
    <option value="GENERIC">Generic</option>
  </select>

  <button id="send" type="button">Get feedback</button>

  <div id="out" aria-live="polite"></div>

  <p class="note">Feedback is generated by an AI model and the misconception labels are experimental. Check them against your course material. Do not paste names or other personal data.</p>

  <script>
    var catalogue = {};
    var button = document.getElementById('send');
    var out = document.getElementById('out');

    fetch('/api/config')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) {
        if (!c) return;
        document.querySelector('label[for=code]').textContent = 'Your ' + c.languageName + ' code';
        document.title = document.title.replace('Java', c.languageName);
        var lead = document.querySelector('.lead');
        if (lead) lead.textContent = lead.textContent.replace('Java', c.languageName);
      })
      .catch(function () {});

    fetch('/api/catalogue')
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) { list.forEach(function (m) { catalogue[m.id] = m; }); })
      .catch(function () { /* names are optional; ids are still shown */ });

    function card(title) {
      var div = document.createElement('div');
      div.className = 'card';
      var h = document.createElement('h2');
      h.textContent = title;
      div.appendChild(h);
      return div;
    }

    function showError(message) {
      out.textContent = '';
      var p = document.createElement('p');
      p.className = 'error';
      p.textContent = message;
      out.appendChild(p);
    }

    button.addEventListener('click', function () {
      var code = document.getElementById('code').value;
      if (!code.trim()) { showError('Please paste some code first.'); return; }

      button.disabled = true;
      out.textContent = 'Working...';

      fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: 'web',
          task: document.getElementById('task').value,
          code: code,
          explanation: document.getElementById('explanation').value,
          condition: document.getElementById('condition').value
        })
      })
        .then(function (r) {
          if (!r.ok) { throw new Error('The server returned status ' + r.status + '.'); }
          return r.json();
        })
        .then(function (result) {
          out.textContent = '';

          var fb = card('Feedback');
          var pre = document.createElement('pre');
          pre.className = 'feedback';
          pre.textContent = result.feedback;
          fb.appendChild(pre);
          out.appendChild(fb);

          (result.matches || []).forEach(function (match) {
            var entry = catalogue[match.misconceptionId];
            var c = card('Possible misconception: ' + (entry ? entry.name : match.misconceptionId));
            if (entry) {
              var topic = document.createElement('span');
              topic.className = 'tag';
              topic.textContent = entry.topic;
              c.appendChild(topic);
              var idea = document.createElement('p');
              idea.textContent = entry.correction;
              c.appendChild(idea);
            }
            var ev = document.createElement('p');
            ev.textContent = 'Evidence: ' + match.evidence;
            c.appendChild(ev);
            out.appendChild(c);
          });
        })
        .catch(function (e) { showError(e.message || 'Something went wrong.'); })
        .finally(function () { button.disabled = false; });
    });
  </script>
</body>
</html>
